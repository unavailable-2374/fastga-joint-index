name: standalone-build-and-correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build without Python discovery
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON
          cmake --build build --parallel 2
      - name: Enable complete validation drivers
        run: |
          python3 -m pip install -r requirements-benchmark.txt
          cmake -S . -B build -DCMAKE_DISABLE_FIND_PACKAGE_Python3=OFF -DSJ_PYTHON_TESTS=ON
          cmake --build build --parallel 2
      - name: SIMULATED correctness fixtures, no performance claims
        run: ctest --test-dir build --output-on-failure
